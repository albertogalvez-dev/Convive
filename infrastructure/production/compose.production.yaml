name: px-convive

services:
  gateway:
    image: ${CONVIVE_GATEWAY_IMAGE:?CONVIVE_GATEWAY_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    # The upstream Caddy binary carries CAP_NET_BIND_SERVICE. Retain that one
    # capability in its bounding set so it can execute under no-new-privileges;
    # the gateway still listens on its unprivileged internal port only.
    cap_add: ["NET_BIND_SERVICE"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data", "/config"]
    restart: unless-stopped
    expose: ["8080"]
    networks: [edge, internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ${CONVIVE_API_IMAGE:?CONVIVE_API_IMAGE is required}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Non-secret production configuration belongs in the reviewed Compose
      # contract rather than the root-only API secret file.
      APP_DEMO_MODE: "1"
      DEFAULT_URI: https://app.conviveaula.com
      # Reconciliation derives this narrowly from the platform-created
      # px-convive-internal network and writes it into the immutable release
      # environment. Never widen this to a generic private range or wildcard.
      TRUSTED_PROXIES: ${CONVIVE_TRUSTED_PROXIES:?CONVIVE_TRUSTED_PROXIES is required}
      # The only approved public production mode while Convive is a
      # fictional-data demonstration. The API rejects all reporter mutations
      # before controller payload handling; a real-data mode needs a separate
      # controller, privacy and pilot approval.
      PUBLIC_REPORTING_MODE: fictional_demo
      # Private named volume; never mounted by the gateway or exposed as a
      # static path. Production evidence remains fictional-only.
      ATTACHMENT_STORAGE_DIRECTORY: /var/lib/convive/attachments
      # Email delivery is an explicit post-demonstration provider gate. Keep
      # the feature absent even if a populated secret file is reused.
      MAILER_DSN: "null://null"
      REPORTER_EMAIL_ENABLED: "0"
      REPORTER_EMAIL_FROM: no-reply@conviveaula.example
      # Reaches the isolated scanner over the private scan network only. When
      # absent the API falls back to the fail-closed scanner, so a missing
      # daemon quarantines attachments instead of releasing them.
      CLAMAV_DSN: tcp://clamav:3310
      REPORTER_EMAIL_PUBLIC_URL: https://app.conviveaula.com/verificar-correo
      REPORTER_EMAIL_FOLLOW_UP_URL: https://app.conviveaula.com/seguimiento
    env_file:
      - ${CONVIVE_SECRET_DIR:?CONVIVE_SECRET_DIR is required}/api.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      attachment-store-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Symfony cache and logs are runtime-only. Keep them writable without
    # weakening the read-only application filesystem or persisting data.
    tmpfs:
      - /tmp
      - /app/var:uid=33,gid=33,mode=0770
    volumes: [attachment-data:/var/lib/convive/attachments]
    restart: unless-stopped
    networks: [internal, data, cache, scan]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # A short-lived privileged setup step gives the unprivileged PHP process
  # exclusive ownership of the private attachment volume. It has no network
  # and no access to application, database, cache or gateway volumes.
  attachment-store-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    volumes: [attachment-data:/attachments]
    entrypoint: ["/bin/sh", "-ec"]
    # Compose otherwise tokenises a scalar `command` before it reaches the
    # explicit `sh -ec` entrypoint. Keep the complete setup script as its one
    # command argument so BusyBox executes every line rather than `mkdir`
    # without its directory argument.
    command:
      - |
        mkdir -p /attachments
        chown 33:33 /attachments
        chmod 0700 /attachments
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  database:
    # postgres:18.4-bookworm
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: convive
      POSTGRES_USER: convive
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [database-data:/var/lib/postgresql]
    read_only: true
    tmpfs: ["/tmp", "/run/postgresql"]
    cap_drop: ["ALL"]
    # The upstream entrypoint must initialize the newly mounted, private data
    # directory before it drops to the postgres user.
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [data]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=convive --dbname=convive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    # redis:8.2.1-alpine
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    # The official image drops to its redis user before opening a configuration
    # file. Compose file-backed secrets preserve the host file's root-only
    # mode, so read the password once as the short-lived root entrypoint and
    # immediately hand it to the upstream entrypoint, which drops privileges
    # before exec'ing Redis. The secret is neither copied to a volume nor
    # present in this rendered Compose contract.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(sed -n 's/^requirepass //p' /run/secrets/redis_conf)"
        test -n "$$password"
        exec /usr/local/bin/docker-entrypoint.sh redis-server --requirepass "$$password" --appendonly yes
    secrets: [redis_conf]
    volumes: [redis-data:/data]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    # The upstream entrypoint assigns the fresh private volume before it drops
    # to the redis user.
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [cache]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Docker executes this check as the container's root configuration user.
      # Redis itself has already dropped to its dedicated unprivileged user and
      # cannot reread this root-only mount.
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /run/secrets/redis_conf)\" ping | grep -F PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Isolated attachment scanner. It reaches the internet only to refresh
  # signatures, and the API reaches it only over the private scan network, so
  # it never shares a network with the database, Redis or the attachment store.
  # It receives file bytes through INSTREAM and no report metadata whatsoever.
  clamav:
    # clamav/clamav:1.4.3
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    environment:
      # freshclam refreshes signatures against the official ClamAV endpoint once
      # a day; operating on stale signatures is not an option, and more frequent
      # checks would widen egress for no material gain.
      CLAMAV_NO_FRESHCLAM: "false"
      FRESHCLAM_CHECKS: "1"
    volumes: [clamav-signatures:/var/lib/clamav]
    # The upstream entrypoint creates a runtime directory, assigns its private
    # signature database, then starts scanner processes as the unprivileged
    # clamav account. Retain exactly the capabilities for those transitions;
    # every network and administrative capability remains removed.
    cap_add: ["CHOWN", "FOWNER", "SETGID", "SETUID"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [scan, signature-refresh]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  database-data:
    name: px_convive_database
  redis-data:
    name: px_convive_redis
  attachment-data:
    name: px_convive_attachments
  clamav-signatures:
    name: px_convive_clamav_signatures

networks:
  edge:
    name: px-convive-edge
    external: true
  internal:
    name: px-convive-internal
    external: true
  data:
    name: px-convive-data
    internal: true
  cache:
    name: px-convive-cache
    internal: true
  # Carries only API-to-scanner traffic. Internal, so a compromised scanner
  # cannot reach the database, Redis or the attachment store through it.
  scan:
    name: px-convive-scan
    internal: true
  # The scanner's only route out, used exclusively by freshclam to refresh
  # signatures. No other service joins it.
  signature-refresh:
    name: px-convive-signature-refresh

secrets:
  database_password:
    file: ${CONVIVE_SECRET_DIR:?CONVIVE_SECRET_DIR is required}/database_password
  redis_conf:
    file: ${CONVIVE_SECRET_DIR:?CONVIVE_SECRET_DIR is required}/redis.conf
