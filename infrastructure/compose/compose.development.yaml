services:
  web:
    volumes:
      - ../../apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:4200:4200"

  api:
    environment:
      DATABASE_URL: "postgresql://convive:convive-development-only@database:5432/convive?serverVersion=18.4&charset=utf8"
      SESSION_DATABASE_URL: "pgsql:host=database;port=5432;dbname=convive;user=convive;password=convive-development-only"
      SESSION_DATABASE_URL_TEST: "pgsql:host=database;port=5432;dbname=convive_test;user=convive;password=convive-development-only"
      ATTACHMENT_STORAGE_DIRECTORY: /var/lib/convive/attachments
      MAILER_DSN: smtp://mailpit:1025
      REPORTER_EMAIL_ENABLED: 1
      REPORTER_EMAIL_FROM: no-reply@conviveaula.example
      REPORTER_EMAIL_PUBLIC_URL: http://localhost:4200/verificar-correo
      REPORTER_EMAIL_FOLLOW_UP_URL: http://localhost:4200/seguimiento
    volumes:
      - ../../apps/api:/app
      - attachment-data:/var/lib/convive/attachments
    ports:
      - "127.0.0.1:8000:8000"

  notification-worker:
    build:
      context: ../../apps/api
      target: development
    command:
      - php
      - bin/console
      - app:reporter-notifications:deliver
      - --limit=20
      - --watch
      - --sleep=2
      - --quiet
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: development-only-notification-worker
      DATABASE_URL: postgresql://convive:convive-development-only@database:5432/convive?serverVersion=18.4&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      REPORTER_EMAIL_ENABLED: 1
      REPORTER_EMAIL_FROM: no-reply@conviveaula.example
      REPORTER_EMAIL_PUBLIC_URL: http://localhost:4200/verificar-correo
      REPORTER_EMAIL_FOLLOW_UP_URL: http://localhost:4200/seguimiento
    volumes:
      - ../../apps/api:/app
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 100
      MP_SMTP_AUTH_ACCEPT_ANY: 0
      MP_SMTP_AUTH_ALLOW_INSECURE: 0
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  database:
    environment:
      POSTGRES_DB: convive
      POSTGRES_USER: convive
      POSTGRES_PASSWORD: convive-development-only
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  web-node-modules:
  attachment-data:
  mailpit-data:

networks:
  frontend:
    internal: false
  backend:
    internal: false
