name: convive

services:
  api:
    build:
      context: ../../apps/api
      target: development
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  database:
    image: postgres:18.4-bookworm
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  database-data:

networks:
  backend:
    internal: true
