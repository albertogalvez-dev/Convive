name: convive

services:
  web:
    build:
      context: ../../apps/web
      target: development
    depends_on:
      - api
    networks:
      - frontend

  api:
    build:
      context: ../../apps/api
      target: development
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend

  database:
    image: postgres:18.4-bookworm
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Production-mode console commands and end-to-end tests must exercise the
  # same Redis-backed cache contract as the fictional public release. The
  # service stays private to the development backend network and publishes no
  # host port.
  redis:
    image: redis:8.2.1-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--requirepass",
        "convive-development-only",
      ]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "convive-development-only", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  database-data:

networks:
  frontend:
    internal: true
  backend:
    internal: true
