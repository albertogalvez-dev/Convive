nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: Convive API
            description: Public and professional HTTP API for the Convive school coexistence platform.
            version: 0.1.0

        components:
            schemas:
                AnonymousReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - accessSecret
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference used to identify the submitted report.
                            example: 0123456789ABCDEF0123
                        accessSecret:
                            type: string
                            description: Secret shown once and required for future private access to the report.
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                IdempotentReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report already created by the original request.
                            example: 0123456789ABCDEF0123
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                FollowUpEntry:
                    type: object
                    additionalProperties: false
                    required:
                        - authorType
                        - content
                        - createdAt
                    properties:
                        authorType:
                            type: string
                            description: Who authored the entry, without identifying them.
                            enum:
                                - reporter
                                - professional
                        content:
                            type: string
                        createdAt:
                            type: string
                            format: date-time

                ReportFollowUpStateResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - situationDescription
                        - situationContext
                        - status
                        - createdAt
                        - followUpEntries
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report.
                            example: 0123456789ABCDEF0123
                        situationDescription:
                            type: string
                            description: The situation description originally submitted by the reporter.
                        situationContext:
                            type: string
                            enum:
                                - in_person
                                - digital
                                - mixed
                                - unknown
                        status:
                            type: string
                            enum:
                                - received
                                - reviewed
                            example: received
                        createdAt:
                            type: string
                            format: date-time
                        followUpEntries:
                            type: array
                            maxItems: 100
                            description: Authorised follow-up entries ordered by creation time and UUID, oldest first.
                            items:
                                $ref: '#/components/schemas/FollowUpEntry'

                ReporterAttachment:
                    type: object
                    additionalProperties: false
                    required: [id, status, createdAt, description]
                    properties:
                        id:
                            type: string
                            format: uuid
                        status:
                            type: string
                            enum: [processing, available, unavailable]
                            description: A minimal lifecycle state that never exposes a scanner verdict.
                        createdAt:
                            type: string
                            format: date-time
                        description:
                            type: string
                            nullable: true
                            maxLength: 500
                            description: Optional reporter-supplied context. The original client filename is never stored or returned.
                        mediaType:
                            type: string
                            enum: [application/pdf, image/jpeg, image/png]
                            description: Present only when the attachment is available.
                        byteSize:
                            type: integer
                            minimum: 1
                            maximum: 5242880
                            description: Present only when the attachment is available.

                ProfessionalReportAttachment:
                    type: object
                    additionalProperties: false
                    required: [id, mediaType, byteSize, createdAt, description]
                    properties:
                        id:
                            type: string
                            format: uuid
                        mediaType:
                            type: string
                            enum: [application/pdf, image/jpeg, image/png]
                        byteSize:
                            type: integer
                            minimum: 1
                            maximum: 5242880
                        createdAt:
                            type: string
                            format: date-time
                        description:
                            type: string
                            nullable: true
                            maxLength: 500
                            description: Optional reporter-supplied context. The original client filename is never stored or returned.

                ProfessionalReportSummary:
                    type: object
                    additionalProperties: false
                    required:
                        - id
                        - publicReference
                        - situationPreview
                        - situationContext
                        - status
                        - createdAt
                    properties:
                        id:
                            type: string
                            format: uuid
                        publicReference:
                            type: string
                            example: 0123456789ABCDEF0123
                        situationPreview:
                            type: string
                            maxLength: 111
                        situationContext:
                            type: string
                            enum: [in_person, digital, mixed, unknown]
                        status:
                            type: string
                            enum: [new, reviewed]
                        createdAt:
                            type: string
                            format: date-time

                ProfessionalReportReview:
                    type: object
                    additionalProperties: false
                    required: [reason, reviewedAt]
                    properties:
                        reason:
                            type: string
                            minLength: 10
                            maxLength: 1000
                        reviewedAt:
                            type: string
                            format: date-time

                ProfessionalReportDetail:
                    type: object
                    additionalProperties: false
                    required:
                        - id
                        - publicReference
                        - situationPreview
                        - situationContext
                        - status
                        - createdAt
                        - situationDescription
                        - review
                        - followUpEntries
                    properties:
                        id:
                            type: string
                            format: uuid
                        publicReference:
                            type: string
                            example: 0123456789ABCDEF0123
                        situationPreview:
                            type: string
                            maxLength: 111
                        situationContext:
                            type: string
                            enum: [in_person, digital, mixed, unknown]
                        status:
                            type: string
                            enum: [new, reviewed]
                        createdAt:
                            type: string
                            format: date-time
                        situationDescription:
                            type: string
                        review:
                            oneOf:
                                - $ref: '#/components/schemas/ProfessionalReportReview'
                                - type: 'null'
                        followUpEntries:
                            type: array
                            maxItems: 100
                            items:
                                $ref: '#/components/schemas/FollowUpEntry'

                ProfessionalReportPage:
                    type: object
                    additionalProperties: false
                    required: [items, pagination]
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProfessionalReportSummary'
                        pagination:
                            type: object
                            additionalProperties: false
                            required: [limit, nextCursor]
                            properties:
                                limit:
                                    type: integer
                                    minimum: 1
                                    maximum: 50
                                nextCursor:
                                    oneOf:
                                        - type: string
                                          maxLength: 512
                                        - type: 'null'

                ProfessionalReportReviewResponse:
                    type: object
                    additionalProperties: false
                    required: [review]
                    properties:
                        review:
                            $ref: '#/components/schemas/ProfessionalReportReview'

                ProblemDetails:
                    type: object
                    additionalProperties: false
                    required:
                        - type
                        - title
                        - status
                        - detail
                    properties:
                        type:
                            type: string
                            format: uri-reference
                        title:
                            type: string
                        status:
                            type: integer
                            minimum: 400
                            maximum: 599
                        detail:
                            type: string
                        errors:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required:
                                    - field
                                    - message
                                properties:
                                    field:
                                        type: string
                                    message:
                                        type: string

            securitySchemes:
                professionalSession:
                    type: apiKey
                    in: cookie
                    name: professional_session
                    description: >-
                        Opaque server-side session identifier for an authenticated
                        professional. Named professional_session in development and
                        __Host-professional_session (Secure, HttpOnly, SameSite=Lax,
                        Path=/, no Domain) in production.
                reportAccessCookie:
                    type: apiKey
                    in: cookie
                    name: report_access
                    description: >-
                        Opaque, short-lived capability handle scoped to
                        exactly one report. Issued via
                        POST /api/v1/public/report-access-grants and cleared
                        via DELETE /api/v1/reporter/access-grant. Named
                        report_access in development and __Host-report_access
                        (Secure, HttpOnly, SameSite=Lax, Path=/, no Domain)
                        in production.

    type_info: true

    areas:
        path_patterns:
            - ^/api/v1
