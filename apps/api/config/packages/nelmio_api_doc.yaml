nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: Convive API
            description: Public and professional HTTP API for the Convive school coexistence platform.
            version: 0.1.0

        components:
            schemas:
                AnonymousReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - accessSecret
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference used to identify the submitted report.
                            example: 0123456789ABCDEF0123
                        accessSecret:
                            type: string
                            description: Secret shown once and required for future private access to the report.
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                IdempotentReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report already created by the original request.
                            example: 0123456789ABCDEF0123
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                FollowUpEntry:
                    type: object
                    additionalProperties: false
                    required:
                        - authorType
                        - content
                        - createdAt
                    properties:
                        authorType:
                            type: string
                            description: Who authored the entry, without identifying them.
                            enum:
                                - reporter
                                - professional
                        content:
                            type: string
                        createdAt:
                            type: string
                            format: date-time

                ReportFollowUpStateResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - situationDescription
                        - situationContext
                        - status
                        - createdAt
                        - followUpEntries
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report.
                            example: 0123456789ABCDEF0123
                        situationDescription:
                            type: string
                            description: The situation description originally submitted by the reporter.
                        situationContext:
                            type: string
                            enum:
                                - in_person
                                - digital
                                - mixed
                                - unknown
                        reporterTaxonomy:
                            $ref: '#/components/schemas/ReporterTriageTaxonomy'
                        status:
                            type: string
                            enum:
                                - received
                                - reviewed
                            example: received
                        createdAt:
                            type: string
                            format: date-time
                        followUpEntries:
                            type: array
                            maxItems: 100
                            description: Authorised follow-up entries ordered by creation time and UUID, oldest first.
                            items:
                                $ref: '#/components/schemas/FollowUpEntry'

                ReporterAttachment:
                    type: object
                    additionalProperties: false
                    required: [id, status, createdAt, description]
                    properties:
                        id:
                            type: string
                            format: uuid
                        status:
                            type: string
                            enum: [processing, available, unavailable]
                            description: A minimal lifecycle state that never exposes a scanner verdict.
                        createdAt:
                            type: string
                            format: date-time
                        description:
                            type: string
                            nullable: true
                            maxLength: 500
                            description: Optional reporter-supplied context. The original client filename is never stored or returned.
                        mediaType:
                            type: string
                            enum: [application/pdf, image/jpeg, image/png]
                            description: Present only when the attachment is available.
                        byteSize:
                            type: integer
                            minimum: 1
                            maximum: 5242880
                            description: Present only when the attachment is available.

                ProfessionalReportAttachment:
                    type: object
                    additionalProperties: false
                    required: [id, mediaType, byteSize, createdAt, description]
                    properties:
                        id:
                            type: string
                            format: uuid
                        mediaType:
                            type: string
                            enum: [application/pdf, image/jpeg, image/png]
                        byteSize:
                            type: integer
                            minimum: 1
                            maximum: 5242880
                        createdAt:
                            type: string
                            format: date-time
                        description:
                            type: string
                            nullable: true
                            maxLength: 500
                            description: Optional reporter-supplied context. The original client filename is never stored or returned.

                ReporterTriageTaxonomy:
                    type: object
                    additionalProperties: false
                    required: [version, recurrence, attentionCue]
                    properties:
                        version:
                            type: string
                            example: andalucia-v1
                        recurrence:
                            type: string
                            enum: [single, repeated, ongoing, unknown]
                        attentionCue:
                            type: string
                            enum: [needs_prompt_attention, no_prompt_attention_indicated, unknown]

                ProfessionalTriageTaxonomy:
                    type: object
                    additionalProperties: false
                    required: [version, concernCategory, recurrence, attentionCue]
                    properties:
                        version:
                            type: string
                            example: andalucia-v1
                        concernCategory:
                            type: string
                            nullable: true
                            enum: [peer_interaction, digital_interaction, exclusion_or_isolation, harmful_language_or_conduct, safety_or_wellbeing_concern, other, unknown]
                        recurrence:
                            type: string
                            nullable: true
                            enum: [single, repeated, ongoing, unknown]
                        attentionCue:
                            type: string
                            nullable: true
                            enum: [needs_prompt_attention, no_prompt_attention_indicated, unknown]

                ProfessionalReportSummary:
                    type: object
                    additionalProperties: false
                    required:
                        - id
                        - publicReference
                        - situationPreview
                        - situationContext
                        - reporterTaxonomy
                        - status
                        - createdAt
                    properties:
                        id:
                            type: string
                            format: uuid
                        publicReference:
                            type: string
                            example: 0123456789ABCDEF0123
                        situationPreview:
                            type: string
                            maxLength: 111
                        situationContext:
                            type: string
                            enum: [in_person, digital, mixed, unknown]
                        reporterTaxonomy:
                            $ref: '#/components/schemas/ReporterTriageTaxonomy'
                        status:
                            type: string
                            enum: [new, reviewed]
                        createdAt:
                            type: string
                            format: date-time

                ProfessionalReportReview:
                    type: object
                    additionalProperties: false
                    required: [reason, reviewedAt, professionalTaxonomy]
                    properties:
                        reason:
                            type: string
                            minLength: 10
                            maxLength: 1000
                        reviewedAt:
                            type: string
                            format: date-time
                        professionalTaxonomy:
                            $ref: '#/components/schemas/ProfessionalTriageTaxonomy'

                ProfessionalReportDetail:
                    type: object
                    additionalProperties: false
                    required:
                        - id
                        - publicReference
                        - situationPreview
                        - situationContext
                        - reporterTaxonomy
                        - status
                        - createdAt
                        - situationDescription
                        - review
                        - followUpEntries
                        - triageDecisions
                    properties:
                        id:
                            type: string
                            format: uuid
                        publicReference:
                            type: string
                            example: 0123456789ABCDEF0123
                        situationPreview:
                            type: string
                            maxLength: 111
                        situationContext:
                            type: string
                            enum: [in_person, digital, mixed, unknown]
                        reporterTaxonomy:
                            $ref: '#/components/schemas/ReporterTriageTaxonomy'
                        status:
                            type: string
                            enum: [new, reviewed]
                        createdAt:
                            type: string
                            format: date-time
                        situationDescription:
                            type: string
                        review:
                            oneOf:
                                - $ref: '#/components/schemas/ProfessionalReportReview'
                                - type: 'null'
                        followUpEntries:
                            type: array
                            maxItems: 100
                            items:
                                $ref: '#/components/schemas/FollowUpEntry'
                        triageDecisions:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProfessionalReportTriageDecision'

                ProfessionalReportTriageDecision:
                    type: object
                    additionalProperties: false
                    required: [id, outcome, reason, decidedAt, decidedBy, caseId]
                    properties:
                        id:
                            type: string
                            format: uuid
                        outcome:
                            type: string
                            enum: [keep, redirect, dismiss, link_to_case]
                        reason:
                            type: string
                            minLength: 10
                            maxLength: 1000
                        decidedAt:
                            type: string
                            format: date-time
                        decidedBy:
                            type: object
                            additionalProperties: false
                            required: [id, name]
                            properties:
                                id:
                                    type: string
                                    format: uuid
                                name:
                                    type: string
                        caseId:
                            oneOf:
                                - type: string
                                  format: uuid
                                - type: 'null'

                ProfessionalReportTriageResponse:
                    type: object
                    additionalProperties: false
                    required: [decision]
                    properties:
                        decision:
                            $ref: '#/components/schemas/ProfessionalReportTriageDecision'

                ProfessionalReportPage:
                    type: object
                    additionalProperties: false
                    required: [items, pagination]
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/ProfessionalReportSummary'
                        pagination:
                            type: object
                            additionalProperties: false
                            required: [limit, nextCursor]
                            properties:
                                limit:
                                    type: integer
                                    minimum: 1
                                    maximum: 50
                                nextCursor:
                                    oneOf:
                                        - type: string
                                          maxLength: 512
                                        - type: 'null'

                ProfessionalReportReviewResponse:
                    type: object
                    additionalProperties: false
                    required: [review]
                    properties:
                        review:
                            $ref: '#/components/schemas/ProfessionalReportReview'

                ProfessionalCaseSummary:
                    type: object
                    additionalProperties: false
                    required: [id, status, modality, createdAt, organisationName, assignmentRole, pendingTasks, overdueTasks, nextDueAt]
                    properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [assessment, active, closed] }
                        modality: { type: string, enum: [in_person, digital, mixed, unknown] }
                        createdAt: { type: string, format: date-time }
                        organisationName: { type: string }
                        assignmentRole: { type: string, enum: [lead, contributor, observer] }
                        pendingTasks: { type: integer, minimum: 0 }
                        overdueTasks: { type: integer, minimum: 0 }
                        nextDueAt:
                            oneOf:
                                - { type: string, format: date-time }
                                - { type: 'null' }

                ProfessionalCasePage:
                    type: object
                    additionalProperties: false
                    required: [items, pagination]
                    properties:
                        items:
                            type: array
                            maxItems: 50
                            items: { $ref: '#/components/schemas/ProfessionalCaseSummary' }
                        pagination:
                            type: object
                            additionalProperties: false
                            required: [limit, nextCursor]
                            properties:
                                limit: { type: integer, minimum: 1, maximum: 50 }
                                nextCursor:
                                    oneOf:
                                        - { type: string, maxLength: 512 }
                                        - { type: 'null' }

                ProfessionalCaseOperationalSummary:
                    type: object
                    additionalProperties: false
                    required: [assigned, overdue, upcoming]
                    properties:
                        assigned: { type: integer, minimum: 0 }
                        overdue: { type: integer, minimum: 0 }
                        upcoming: { type: integer, minimum: 0 }

                ProfessionalCasePerson:
                    type: object
                    additionalProperties: false
                    required: [id, name, role]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string, maxLength: 120 }
                        role: { type: string, enum: [affected, alleged_actor, witness, guardian, other] }

                ProfessionalCaseAssignment:
                    type: object
                    additionalProperties: false
                    required: [id, professional, role, assignedAt]
                    properties:
                        id: { type: string, format: uuid }
                        professional:
                            type: object
                            additionalProperties: false
                            required: [id, name]
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                        role: { type: string, enum: [lead, contributor, observer] }
                        assignedAt: { type: string, format: date-time }

                ProfessionalCaseTask:
                    type: object
                    additionalProperties: false
                    required: [id, title, stage, kind, status, dueAt, overdue, owner, source, resolvedAt, resolvedBy, notApplicableReason]
                    properties:
                        id: { type: string, format: uuid }
                        title: { type: string, maxLength: 160 }
                        stage:
                            type: string
                            enum: [identification, immediate_actions, urgent_protection, family_communication, professional_coordination, information_collection, educational_measures, inspection_communication, assessment, action_plan, family_measures, inspection_follow_up]
                        kind: { type: string, enum: [internal_action, external_communication] }
                        status: { type: string, enum: [pending, completed, not_applicable] }
                        dueAt: { type: string, format: date-time }
                        overdue: { type: boolean }
                        owner:
                            type: object
                            additionalProperties: false
                            required: [id, name]
                            properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                        source:
                            type: object
                            additionalProperties: false
                            required: [id, title, version, authority, territory, uri]
                            properties:
                                id: { type: string, format: uuid }
                                title: { type: string, maxLength: 180 }
                                version: { type: string, maxLength: 40 }
                                authority: { type: string, enum: [binding, recommended, internal] }
                                territory: { type: string, maxLength: 20 }
                                uri:
                                    oneOf:
                                        - { type: string, format: uri }
                                        - { type: 'null' }
                        resolvedAt:
                            oneOf:
                                - { type: string, format: date-time }
                                - { type: 'null' }
                        resolvedBy:
                            oneOf:
                                -
                                    type: object
                                    additionalProperties: false
                                    required: [id, name]
                                    properties:
                                        id: { type: string, format: uuid }
                                        name: { type: string }
                                - { type: 'null' }
                        notApplicableReason:
                            oneOf:
                                - { type: string, maxLength: 500 }
                                - { type: 'null' }

                ProfessionalCaseTaskPlanningCatalogue:
                    type: object
                    additionalProperties: false
                    required: [items]
                    properties:
                        items:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required: [id, title, stage, kind, source]
                                properties:
                                    id: { type: string, format: uuid }
                                    title: { type: string, maxLength: 160 }
                                    stage:
                                        type: string
                                        enum: [identification, immediate_actions, urgent_protection, family_communication, professional_coordination, information_collection, educational_measures, inspection_communication, assessment, action_plan, family_measures, inspection_follow_up]
                                    kind: { type: string, enum: [internal_action, external_communication] }
                                    source:
                                        type: object
                                        additionalProperties: false
                                        required: [title, version, authority, territory, uri]
                                        properties:
                                            title: { type: string, maxLength: 180 }
                                            version: { type: string, maxLength: 40 }
                                            authority: { type: string, enum: [binding, recommended, internal] }
                                            territory: { type: string, maxLength: 20 }
                                            uri:
                                                oneOf:
                                                    - { type: string, format: uri }
                                                    - { type: 'null' }

                ProfessionalCaseEvidence:
                    type: object
                    additionalProperties: false
                    required: [id, description, mediaType, byteSize, createdAt]
                    properties:
                        id: { type: string, format: uuid }
                        description:
                            oneOf:
                                - { type: string, maxLength: 500 }
                                - { type: 'null' }
                        mediaType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
                        createdAt: { type: string, format: date-time }

                ProfessionalCaseAuditEvent:
                    type: object
                    additionalProperties: false
                    required: [id, action, target, actorName, occurredAt]
                    properties:
                        id: { type: string, format: uuid }
                        action:
                            type: string
                            enum: [case_created, report_linked, assignment_created, assignment_changed, assignment_revoked, task_created, task_completed, task_marked_not_applicable, evidence_download_authorised, audit_exported]
                        target:
                            type: string
                            enum: [case, triage_decision, assignment, task, attachment, audit_trail]
                        actorName: { type: string, maxLength: 160 }
                        occurredAt: { type: string, format: date-time }

                ProfessionalCaseAuditEventPage:
                    type: object
                    additionalProperties: false
                    required: [items]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCaseAuditEvent' }

                ProfessionalCaseTimelineEvent:
                    type: object
                    additionalProperties: false
                    required: [type, occurredAt]
                    properties:
                        type: { type: string, enum: [case_created, assignment_added, task_created, task_resolved] }
                        occurredAt: { type: string, format: date-time }

                ProfessionalCaseDetail:
                    type: object
                    additionalProperties: false
                    required: [id, status, modality, createdAt, organisationName, assignmentRole, pendingTasks, overdueTasks, nextDueAt, permissions, assignableProfessionals, people, assignments, tasks, sourceReport, evidence, timeline]
                    properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [assessment, active, closed] }
                        modality: { type: string, enum: [in_person, digital, mixed, unknown] }
                        createdAt: { type: string, format: date-time }
                        organisationName: { type: string }
                        assignmentRole: { type: string, enum: [lead, contributor, observer] }
                        pendingTasks: { type: integer, minimum: 0 }
                        overdueTasks: { type: integer, minimum: 0 }
                        nextDueAt:
                            oneOf:
                                - { type: string, format: date-time }
                                - { type: 'null' }
                        permissions:
                            type: object
                            additionalProperties: false
                            required: [manage, manageAssignments, viewAudit]
                            properties:
                                manage: { type: boolean }
                                manageAssignments: { type: boolean }
                                viewAudit: { type: boolean }
                        assignableProfessionals:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required: [id, name]
                                properties:
                                    id: { type: string, format: uuid }
                                    name: { type: string }
                        people:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCasePerson' }
                        assignments:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCaseAssignment' }
                        tasks:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCaseTask' }
                        sourceReport:
                            oneOf:
                                -
                                    type: object
                                    additionalProperties: false
                                    required: [id, publicReference, decision]
                                    properties:
                                        id: { type: string, format: uuid }
                                        publicReference: { type: string }
                                        decision:
                                            oneOf:
                                                -
                                                    type: object
                                                    additionalProperties: false
                                                    required: [outcome, reason, decidedAt]
                                                    properties:
                                                        outcome: { type: string, enum: [link_to_case] }
                                                        reason: { type: string, minLength: 10, maxLength: 1000 }
                                                        decidedAt: { type: string, format: date-time }
                                                - { type: 'null' }
                                - { type: 'null' }
                        evidence:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCaseEvidence' }
                        timeline:
                            type: array
                            items: { $ref: '#/components/schemas/ProfessionalCaseTimelineEvent' }

                ProblemDetails:
                    type: object
                    additionalProperties: false
                    required:
                        - type
                        - title
                        - status
                        - detail
                    properties:
                        type:
                            type: string
                            format: uri-reference
                        title:
                            type: string
                        status:
                            type: integer
                            minimum: 400
                            maximum: 599
                        detail:
                            type: string
                        errors:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required:
                                    - field
                                    - message
                                properties:
                                    field:
                                        type: string
                                    message:
                                        type: string

            securitySchemes:
                professionalSession:
                    type: apiKey
                    in: cookie
                    name: professional_session
                    description: >-
                        Opaque server-side session identifier for an authenticated
                        professional. Named professional_session in development and
                        __Host-professional_session (Secure, HttpOnly, SameSite=Lax,
                        Path=/, no Domain) in production.
                reportAccessCookie:
                    type: apiKey
                    in: cookie
                    name: report_access
                    description: >-
                        Opaque, short-lived capability handle scoped to
                        exactly one report. Issued via
                        POST /api/v1/public/report-access-grants and cleared
                        via DELETE /api/v1/reporter/access-grant. Named
                        report_access in development and __Host-report_access
                        (Secure, HttpOnly, SameSite=Lax, Path=/, no Domain)
                        in production.

    type_info: true

    areas:
        path_patterns:
            - ^/api/v1
