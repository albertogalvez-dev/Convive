nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: Convive API
            description: Public and professional HTTP API for the Convive school coexistence platform.
            version: 0.1.0

        components:
            schemas:
                AnonymousReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - accessSecret
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference used to identify the submitted report.
                            example: 0123456789ABCDEF0123
                        accessSecret:
                            type: string
                            description: Secret shown once and required for future private access to the report.
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                IdempotentReportSubmissionResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - status
                        - createdAt
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report already created by the original request.
                            example: 0123456789ABCDEF0123
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time

                ReportFollowUpStateResponse:
                    type: object
                    additionalProperties: false
                    required:
                        - publicReference
                        - situationDescription
                        - situationContext
                        - status
                        - createdAt
                        - followUpEntries
                    properties:
                        publicReference:
                            type: string
                            description: Public reference of the report.
                            example: 0123456789ABCDEF0123
                        situationDescription:
                            type: string
                            description: The situation description originally submitted by the reporter.
                        situationContext:
                            type: string
                            enum:
                                - in_person
                                - digital
                                - mixed
                                - unknown
                        status:
                            type: string
                            enum:
                                - received
                            example: received
                        createdAt:
                            type: string
                            format: date-time
                        followUpEntries:
                            type: array
                            description: Authorised follow-up entries. Always empty until follow-up messaging is delivered.
                            items: {}

                ProblemDetails:
                    type: object
                    additionalProperties: false
                    required:
                        - type
                        - title
                        - status
                        - detail
                    properties:
                        type:
                            type: string
                            format: uri-reference
                        title:
                            type: string
                        status:
                            type: integer
                            minimum: 400
                            maximum: 599
                        detail:
                            type: string
                        errors:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required:
                                    - field
                                    - message
                                properties:
                                    field:
                                        type: string
                                    message:
                                        type: string

            securitySchemes:
                reportAccessCookie:
                    type: apiKey
                    in: cookie
                    name: report_access
                    description: >-
                        Opaque, short-lived capability handle scoped to
                        exactly one report. Issued via
                        POST /api/v1/public/report-access-grants and cleared
                        via DELETE /api/v1/reporter/access-grant. Named
                        report_access in development and __Host-report_access
                        (Secure, HttpOnly, SameSite=Lax, Path=/, no Domain)
                        in production.

    type_info: true

    areas:
        path_patterns:
            - ^/api/v1
