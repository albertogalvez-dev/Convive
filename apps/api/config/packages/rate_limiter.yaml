framework:
    rate_limiter:
        # Dedicated verification limit for issue #23 (report-access-grants).
        # Deliberately narrow: protects only secret verification, ahead of
        # database lookup and capability issuance. General public-endpoint
        # anti-abuse (submission, uploads) is tracked separately in #41.
        report_access_verification:
            policy: sliding_window
            limit: 5
            interval: '1 minute'

        # Anti-abuse limit for anonymous report submission (#41).
        # Independent of the verification limiter above: a burst of
        # legitimate submissions from one IP (e.g. a shared school
        # network) shouldn't share a budget with secret verification.
        report_submission:
            policy: sliding_window
            limit: 5
            interval: '1 minute'

        report_follow_up_read_ip:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        report_follow_up_read_capability:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

        report_follow_up_append_ip:
            policy: sliding_window
            limit: 20
            interval: '1 minute'

        report_follow_up_append_capability:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
