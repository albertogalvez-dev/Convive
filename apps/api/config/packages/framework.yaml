# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        name: '%professional_session_cookie.name%'
        cookie_secure: '%professional_session_cookie.secure%'
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 1800

    # Stateless, session-free CSRF protection (Sec-Fetch-Site/Origin checks
    # with a double-submit header fallback) for the cookie-authenticated
    # report-access revocation endpoint (#23). No PHP session is required.
    csrf_protection:
        stateless_token_ids:
            [
                'report_access_grant_revocation',
                'report_attachment_upload',
                'reporter_email_configuration',
                'professional_login',
                'professional_logout',
                'professional_report_review',
                'professional_report_response',
                'professional_report_triage',
                'professional_account_credential_acceptance',
                'professional_account_invitation',
                'professional_account_password_reset',
                'professional_account_status_change',
                'professional_membership_grant',
                'professional_membership_change',
                'professional_case_person_add',
                'professional_case_person_correct',
                'professional_case_person_remove',
                'professional_case_lifecycle_transition',
            ]
        check_header: true

    # Explicit per-environment proxy trust (#41): rate limiting keys on
    # the resolved client IP, so an unset or wrong value here would let
    # a forged X-Forwarded-For header defeat every rate limit. Empty by
    # default (nothing is trusted; direct connections only), matching
    # today's proxy-free development/test topology. Set TRUSTED_PROXIES
    # to the real reverse proxy's address once one is introduced (#63) —
    # never widen this to a wildcard.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers:
        [
            'x-forwarded-for',
            'x-forwarded-host',
            'x-forwarded-proto',
            'x-forwarded-port',
        ]

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
