doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Session and privacy-separated email tables intentionally use DBAL
        # rather than ORM entities. Keep schema validation from treating those
        # explicitly migrated tables as accidental unmanaged assets.
        schema_filter: '~^(?!.*(?:professional_sessions|reporter_email_contacts|reporter_notification_outbox)$)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Organisations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organisations/Domain'
                prefix: 'App\Organisations\Domain'
            Reporting:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reporting/Domain'
                prefix: 'App\Reporting\Domain'
            Professionals:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Professionals/Domain'
                prefix: 'App\Professionals\Domain'
            Cases:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cases/Domain'
                prefix: 'App\Cases\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
