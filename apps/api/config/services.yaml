# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Explicit, environment-specific report-access capability cookie
    # configuration (issue #23). Production must never be weakened by a
    # development default, so the values are set per environment below
    # rather than derived from request-time detection.
    report_access_cookie.name: 'report_access'
    report_access_cookie.secure: false
    professional_session_cookie.name: 'professional_session'
    professional_session_cookie.secure: false
    # Attachment writes require an explicit private runtime directory. The
    # development and production Compose each provide a dedicated private
    # named volume; test overrides this with an ignored cache path below.
    attachment_storage.directory: '%env(ATTACHMENT_STORAGE_DIRECTORY)%'
    reporter_email.enabled: '%env(bool:REPORTER_EMAIL_ENABLED)%'
    reporter_email.from: '%env(REPORTER_EMAIL_FROM)%'
    reporter_email.public_url: '%env(REPORTER_EMAIL_PUBLIC_URL)%'
    reporter_email.follow_up_url: '%env(REPORTER_EMAIL_FOLLOW_UP_URL)%'
    # Public reporting accepts persistent data only in explicitly enabled
    # local/test operational mode. An unknown value is interpreted as
    # disabled by PublicReportingModePolicy, so incomplete production
    # configuration cannot accidentally collect communications.
    public_reporting.mode: '%env(string:PUBLIC_REPORTING_MODE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Bind domain repository ports to their Doctrine adapters
    App\Organisations\Domain\OrganisationRepository: '@App\Organisations\Infrastructure\DoctrineOrganisationRepository'
    App\Reporting\Domain\ReportRepository: '@App\Reporting\Infrastructure\DoctrineReportRepository'
    App\Reporting\Domain\ReportAccessGrantRepository: '@App\Reporting\Infrastructure\DoctrineReportAccessGrantRepository'
    App\Reporting\Domain\ReportFollowUpEntryRepository: '@App\Reporting\Infrastructure\DoctrineReportFollowUpEntryRepository'
    App\Reporting\Domain\ReportAttachmentRepository: '@App\Reporting\Infrastructure\DoctrineReportAttachmentRepository'
    App\Reporting\Domain\ReportTriageDecisionRepository: '@App\Reporting\Infrastructure\DoctrineReportTriageDecisionRepository'
    App\Reporting\Application\AttachmentStorage: '@App\Reporting\Infrastructure\LocalPrivateAttachmentStorage'
    App\Reporting\Application\AttachmentDownloadConcurrencyLimiter: '@App\Reporting\Infrastructure\LocalPrivateAttachmentDownloadConcurrencyLimiter'
    App\Reporting\Application\AttachmentScanner: '@App\Reporting\Infrastructure\UnavailableAttachmentScanner'
    App\Reporting\Application\PublicReportingModePolicy:
        arguments:
            $configuredMode: '%public_reporting.mode%'
    App\Professionals\Domain\ProfessionalRepository: '@App\Professionals\Infrastructure\DoctrineProfessionalRepository'
    App\Professionals\Domain\OrganisationMembershipRepository: '@App\Professionals\Infrastructure\DoctrineOrganisationMembershipRepository'
    App\Professionals\Domain\ProfessionalCredentialInvitationRepository: '@App\Professionals\Infrastructure\DoctrineProfessionalCredentialInvitationRepository'
    App\Professionals\Domain\ProfessionalAccountAuditEventRepository: '@App\Professionals\Infrastructure\DoctrineProfessionalAccountAuditEventRepository'
    App\Professionals\Domain\ProfessionalNotificationRepository: '@App\Professionals\Infrastructure\DoctrineProfessionalNotificationRepository'
    App\Professionals\Domain\ProfessionalAbsenceRepository: '@App\Professionals\Infrastructure\DoctrineProfessionalAbsenceRepository'
    App\Cases\Domain\CaseInvolvedPersonRepository: '@App\Cases\Infrastructure\DoctrineCaseInvolvedPersonRepository'
    App\Cases\Domain\CaseAssignmentRepository: '@App\Cases\Infrastructure\DoctrineCaseAssignmentRepository'
    App\Cases\Domain\CaseTaskRepository: '@App\Cases\Infrastructure\DoctrineCaseTaskRepository'
    App\Cases\Domain\WorkflowSourceVersionRepository: '@App\Cases\Infrastructure\DoctrineWorkflowSourceVersionRepository'
    App\Cases\Domain\WorkflowTaskTemplateRepository: '@App\Cases\Infrastructure\DoctrineWorkflowTaskTemplateRepository'
    App\Cases\Domain\CaseCommunicationRepository: '@App\Cases\Infrastructure\DoctrineCaseCommunicationRepository'
    App\Cases\Domain\CaseWorkspaceRepository: '@App\Cases\Infrastructure\DoctrineCaseWorkspaceRepository'
    App\Cases\Domain\CaseAuditEventRepository: '@App\Cases\Infrastructure\DoctrineCaseAuditEventRepository'
    App\Cases\Domain\ProfessionalExportEventRepository: '@App\Cases\Infrastructure\DoctrineProfessionalExportEventRepository'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(SESSION_DATABASE_URL)%'
            - { db_table: 'professional_sessions' }

    app.professional_login_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.professional_login_network'
            $localFactory: '@limiter.professional_login_account'
            $secret: '%kernel.secret%'

when@prod:
    parameters:
        # __Host- requires Secure, Path=/ and no Domain attribute; only
        # valid when the cookie is always sent over HTTPS.
        report_access_cookie.name: '__Host-report_access'
        report_access_cookie.secure: true
        professional_session_cookie.name: '__Host-professional_session'
        professional_session_cookie.secure: true

when@test:
    parameters:
        attachment_storage.directory: '%kernel.cache_dir%/private-attachments'
        reporter_email.enabled: true

    services:
        App\Reporting\Application\PublicReportingModePolicy:
            public: true
            arguments:
                $configuredMode: '%public_reporting.mode%'

        # The development Compose environment keeps professional sessions in
        # `convive`. Tests must use the same isolated `convive_test` database
        # as Doctrine, without mutating the development session store.
        Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
            arguments:
                - '%env(SESSION_DATABASE_URL_TEST)%'
                - { db_table: 'professional_sessions' }

        # In-memory handler so tests can assert on security-channel log
        # records directly (#41), instead of parsing a log file.
        monolog.security_test_handler:
            class: Monolog\Handler\TestHandler
            public: true
