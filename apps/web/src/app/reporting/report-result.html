<div class="result">
  <div class="heading">
    <span aria-hidden="true">✓</span>
    <h1 id="step-title">Comunicación enviada</h1>
  </div>

  <div class="perforation" aria-hidden="true"></div>

  <section class="access" aria-labelledby="access-title">
    <div class="access-title">
      <h2 id="access-title">Datos de acceso</h2>
      <p class="reference">
        <span>Referencia</span>
        <code>{{ submitted().publicReference }}</code>
      </p>
    </div>

    <div class="warning" role="note">
      <span aria-hidden="true">!</span>
      <p>
        <strong>Este secreto no puede recuperarse.</strong>
        Guárdalo antes de cerrar o perderás el acceso.
      </p>
    </div>

    <span class="secret-label">Secreto</span>
    <div class="secret-row">
      <code>{{ submitted().accessSecret }}</code>
      <button
        type="button"
        class="copy-button"
        aria-label="Copiar secreto de acceso"
        (click)="copyAccessSecret()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="8" width="11" height="11" rx="2"></rect>
          <path d="M16 8V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1"></path>
        </svg>
      </button>
    </div>
    <p class="copy-status" aria-live="polite">{{ copyMessage() }}</p>
  </section>
</div>
