<main class="professional-page">
  <div class="professional-flow">
    <header>
      <a class="wordmark" href="https://conviveaula.com/" aria-label="Convive, inicio público">
        <img src="/convive-logo.svg" alt="" width="180" height="59" />
      </a>
      <span>&Aacute;rea profesional</span>
    </header>

    <section class="access-card" aria-labelledby="access-title">
      <div class="access-intro">
        <span class="access-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
            <path d="M5.5 21a6.5 6.5 0 0 1 13 0" />
          </svg>
        </span>
        <p class="eyebrow">Acceso del centro</p>
        <h1 id="access-title">Tu espacio profesional</h1>
        <p class="introduction">Elige la perspectiva con la que quieres recorrer Convive.</p>
      </div>

      <div class="access-panel">
        <section class="demo-entry" aria-labelledby="demo-entry-title">
          <p class="eyebrow">EXPLORA LA DEMOSTRACIÓN</p>
          <h2 id="demo-entry-title">Elige un rol</h2>
          <p>Todos los recorridos están preparados y son solo de consulta</p>
          <div class="role-selector">
            <label for="demo-role">Perspectiva de demostración</label>
            <select
              id="demo-role"
              [value]="selectedDemoRole()"
              [disabled]="openingDemo() !== null"
              (change)="selectDemonstration($event)"
            >
              @for (role of demoRoles; track role.id) {
                <option [value]="role.id">{{ role.label }}</option>
              }
            </select>
          </div>
          <button
            type="button"
            class="demo-entry-button"
            [disabled]="openingDemo() !== null"
            (click)="openDemonstration(selectedDemoRole())"
          >
            {{ openingDemo() === selectedDemoRole() ? 'Abriendo…' : 'Entrar con esta perspectiva' }}
            <span aria-hidden="true">→</span>
          </button>
          @if (demoErrorMessage(); as message) {
            <p class="error-banner" role="alert">{{ message }}</p>
          }
        </section>
      </div>
    </section>
  </div>
</main>
