<div class="language-switcher">
  <svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="8.5" />
    <path
      d="M3.5 12h17M12 3.5c2.2 2.35 3.35 5.18 3.35 8.5S14.2 18.15 12 20.5C9.8 18.15 8.65 15.32 8.65 12S9.8 5.85 12 3.5Z"
    />
  </svg>
  <label for="language-switcher-select">{{
    'public-site-footer.languageSwitcher.label' | transloco
  }}</label>
  <select id="language-switcher-select" (change)="onChange($event)">
    @for (locale of availableLocales; track locale.code) {
      <option [value]="locale.code" [selected]="locale.code === activeLang()">
        {{ locale.label }}
      </option>
    }
  </select>
</div>
