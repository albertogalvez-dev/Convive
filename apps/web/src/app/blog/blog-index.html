<main class="blog-index">
  <header class="public-header">
    <a class="wordmark" routerLink="/" [attr.aria-label]="content().homeLinkLabel"
      ><img src="/convive-logo.svg" alt="" width="158" height="52"
    /></a>
    <a class="professional-access" href="/profesionales/acceso">{{
      content().professionalAccess
    }}</a>
    <app-language-switcher [compact]="true" (languageChanged)="changeLocale($event)" />
  </header>
  <section class="intro" aria-labelledby="blog-title">
    <p class="eyebrow">{{ content().index.eyebrow }}</p>
    <h1 id="blog-title">{{ content().index.title }}</h1>
    <p>{{ content().index.description }}</p>
  </section>
  <section [attr.aria-label]="content().index.publishedArticlesLabel" class="articles">
    @for (article of articles(); track article.slug) {
      <article>
        <a class="article-cover" [routerLink]="articlePath(article)" tabindex="-1">
          <img
            [src]="article.coverSrc"
            [alt]="article.coverAlt"
            width="1600"
            height="900"
            fetchpriority="high"
          />
        </a>
        <div class="article-summary">
          <p class="eyebrow">{{ article.category }}</p>
          <h2>
            <a [routerLink]="articlePath(article)">{{ article.title }}</a>
          </h2>
          <p>{{ article.description }}</p>
          <small>{{ readingMeta(article) }}</small>
        </div>
      </article>
    }
  </section>

  <app-public-site-footer />
</main>
