<main class="professional-portal" [class.sidebar-collapsed]="sidebarCollapsed()">
  <aside class="portal-sidebar">
    <div class="brand-row">
      <a class="brand" routerLink="/profesionales" aria-label="Ir al inicio profesional">
        <img class="full-logo" src="/convive-logo.svg" alt="Convive" width="158" height="52" />
        <img class="compact-logo" src="/favicon.svg" alt="Convive" width="40" height="40" />
        <span>&Aacute;rea profesional</span>
      </a>
      <button
        class="collapse-button"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="!sidebarCollapsed()"
        [attr.aria-label]="sidebarCollapsed() ? 'Abrir menú lateral' : 'Plegar menú lateral'"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5" /></svg>
      </button>
    </div>

    <nav class="desktop-nav" aria-label="Navegaci&oacute;n profesional">
      <a
        routerLink="/profesionales"
        aria-label="Inicio"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4v-8.5Z" />
        </svg>
        <span>Inicio</span>
      </a>
      <a
        routerLink="/profesionales/comunicaciones"
        routerLinkActive="active"
        aria-label="Comunicaciones"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16v11H9l-5 3V6Z" />
          <path d="M8 10h8M8 13h5" />
        </svg>
        <span>Comunicaciones</span>
      </a>
      <a routerLink="/profesionales/casos" routerLinkActive="active" aria-label="Casos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h5l1.5 2H19v10H5V7Z" />
          <path d="M8 13h8M8 16h5" />
        </svg>
        <span>Casos</span>
      </a>
      <a routerLink="/profesionales/ajustes" routerLinkActive="active" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
          <path
            d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7-.7-2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7 2-.7Z"
          />
        </svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <div class="sidebar-profile">
      @if (professional(); as currentProfessional) {
        <span class="avatar" aria-hidden="true">{{ currentProfessional.name.charAt(0) }}</span>
        <span class="profile-copy"
          ><strong>{{ currentProfessional.name }}</strong></span
        >
      }
      <button
        type="button"
        [disabled]="loggingOut()"
        (click)="logout()"
        aria-label="Cerrar sesi&oacute;n"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10" />
        </svg>
      </button>
    </div>
  </aside>

  <section class="portal-content">
    <div class="desktop-topbar">
      <a
        class="notification-button"
        routerLink="/profesionales/comunicaciones"
        [queryParams]="{ estado: 'new' }"
        aria-label="Ver comunicaciones nuevas"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" />
        </svg>
        @if (newNotificationCount(); as count) {
          @if (count !== '0') {
            <span>{{ count }}</span>
          }
        }
      </a>
    </div>
    <header class="mobile-header">
      <div class="mobile-brand-row">
        <img src="/convive-logo.svg" alt="Convive" width="142" height="47" />
        <button type="button" [disabled]="loggingOut()" (click)="logout()">
          Cerrar sesi&oacute;n
        </button>
      </div>
      <nav aria-label="Navegaci&oacute;n profesional">
        <a
          routerLink="/profesionales"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="active"
          aria-label="Inicio"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4v-8.5Z" /></svg
          ><span>Inicio</span>
        </a>
        <a
          routerLink="/profesionales/comunicaciones"
          routerLinkActive="active"
          aria-label="Comunicaciones"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16v11H9l-5 3V6Z" />
            <path d="M8 10h8M8 13h5" /></svg
          ><span>Comunicaciones</span>
        </a>
        <a routerLink="/profesionales/casos" routerLinkActive="active" aria-label="Casos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h5l1.5 2H19v10H5V7Z" /></svg
          ><span>Casos</span>
        </a>
        <a routerLink="/profesionales/ajustes" routerLinkActive="active" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20.3h-3v-.09A1.7 1.7 0 0 0 10.68 18.66a1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.02 15a1.7 1.7 0 0 0-1.55-1.03H5.4v-3h.07A1.7 1.7 0 0 0 7.02 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.55V4.7h3v.03a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.07v3h-.07A1.7 1.7 0 0 0 19.4 15Z"
            />
          </svg>
          <span>Ajustes</span>
        </a>
      </nav>
    </header>
    <router-outlet />
  </section>
</main>
