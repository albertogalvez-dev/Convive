name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://convive:convive-development-only@127.0.0.1:5432/convive?serverVersion=18.4&charset=utf8"

    services:
      database:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: convive_test
          POSTGRES_USER: convive
          POSTGRES_PASSWORD: convive-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=convive --dbname=convive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, sodium
          coverage: none
          tools: composer:2.10.2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit backend dependencies
        run: |
          for attempt in 1 2 3; do
            if composer audit --locked --no-interaction; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Composer audit failed after 3 attempts."
              exit 1
            fi

            echo "::warning::Composer audit attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

      - name: Lint Symfony configuration
        run: |
          php bin/console lint:yaml config
          php bin/console lint:container

      - name: Verify OpenAPI contract is up to date
        run: |
          php bin/console nelmio:apidoc:dump --format=yaml > /tmp/openapi.yaml
          sed -i '${/^$/d;}' /tmp/openapi.yaml
          diff --unified ../../docs/api/openapi.yaml /tmp/openapi.yaml

      - name: Apply database migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate

      - name: Run backend tests
        run: php bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: >
          docker compose
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          config --quiet

      - name: Bootstrap backend dependencies through Docker Compose
        run: >
          docker compose
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          run --rm --build --no-deps api composer install
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Start the development stack
        run: >
          docker compose
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          up --detach --build

      - name: Verify the Symfony health endpoint
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 30
          --retry-delay 2
          --retry-connrefused
          --retry-all-errors
          http://127.0.0.1:8000/api/v1/health
          | grep --fixed-strings '{"status":"ok"}'

      - name: Verify the Angular development proxy
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 30
          --retry-delay 2
          --retry-connrefused
          --retry-all-errors
          http://127.0.0.1:4200/api/v1/health
          | grep --fixed-strings '{"status":"ok"}'

      - name: Display Docker Compose logs on failure
        if: failure()
        run: >
          docker compose
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          logs --no-color

      - name: Remove the CI development stack
        if: always()
        run: >
          docker compose
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          down --volumes --remove-orphans

  recovery:
    name: Encrypted recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, sodium
          coverage: none
          tools: composer:2.10.2

      - name: Install backend dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate recovery configuration
        shell: bash
        run: |
          bash -n infrastructure/backup/*.sh
          CONVIVE_RESTORE_DATABASE_PASSWORD=configuration-check \
          CONVIVE_RESTORE_APP_SECRET=configuration-check \
          CONVIVE_RESTORE_API_IMAGE=convive-restore-api:configuration-check \
            docker compose \
              -f infrastructure/backup/compose.restore.yaml \
              -f infrastructure/backup/compose.restore.local.yaml \
              config --quiet

      - name: Exercise encrypted backup and isolated restoration
        run: infrastructure/backup/test-recovery.sh

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Bootstrap backend dependencies through Docker Compose
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          run --rm --build --no-deps api composer install
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Start the isolated end-to-end stack
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          up --detach --build

      - name: Apply database migrations
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          exec -T api php bin/console doctrine:migrations:migrate
          --no-interaction

      - name: Create an ephemeral fictional professional credential
        shell: bash
        run: |
          credential="$(openssl rand -hex 32)"
          echo "::add-mask::$credential"
          echo "DEMO_PROFESSIONAL_PASSWORD=$credential" >> "$GITHUB_ENV"
          echo "E2E_PROFESSIONAL_PASSWORD=$credential" >> "$GITHUB_ENV"

      - name: Create the isolated fictional demo dataset
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          exec -T
          -e APP_ENV=prod
          -e APP_DEMO_MODE=1
          -e APP_SECRET=fictional-e2e-only
          -e DEMO_PROFESSIONAL_PASSWORD
          api php bin/console app:demo:seed --env=prod --no-debug

      - name: Wait for the reporting journey
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 30
          --retry-delay 2
          --retry-connrefused
          --retry-all-errors
          http://127.0.0.1:4200/api/v1/health

      - name: Run Chromium end-to-end tests
        working-directory: apps/web
        run: npm run e2e

      - name: Display Docker Compose logs on failure
        if: failure()
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          logs --no-color

      - name: Remove the isolated end-to-end stack
        if: always()
        run: >
          docker compose
          -p convive-e2e
          -f infrastructure/compose/compose.yaml
          -f infrastructure/compose/compose.development.yaml
          down --volumes --remove-orphans

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: it diffs the dependency
    # manifests between the base and head refs, which a push to main
    # doesn't have.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
