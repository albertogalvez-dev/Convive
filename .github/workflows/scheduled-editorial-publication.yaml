name: Publish scheduled editorial articles

on:
  schedule:
    # 07:15 Europe/Madrid while CEST is active. GitHub cron uses UTC; a one-hour
    # shift during CET is acceptable because publication dates, not the clock,
    # determine eligibility.
    - cron: "15 05 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: convive-editorial-publication
  cancel-in-progress: false

jobs:
  prepare-publication:
    name: Prepare due editorial publication review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EDITORIAL_BRANCH: editorial/scheduled-publication

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Reuse an open editorial publication review
        id: open-editorial-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$EDITORIAL_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$open_pr_number" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "number=$open_pr_number" >> "$GITHUB_OUTPUT"
            echo "An editorial publication review is already open: #$open_pr_number"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare due articles and regenerate the sitemap
        if: steps.open-editorial-pr.outputs.open != 'true'
        working-directory: apps/web
        run: |
          set -euo pipefail
          node scripts/publish-due-blog-articles.mjs
          node scripts/generate-sitemap.mjs

      - name: Create an editorial publication pull request when required
        id: publication
        if: steps.open-editorial-pr.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/blog/blog-catalog.json apps/web/src/sitemap.xml
          git commit -m 'chore(editorial): publish due blog articles'
          git push --force-with-lease origin "HEAD:$EDITORIAL_BRANCH"

          pr_body="$(mktemp)"
          cat > "$pr_body" <<'EOF'
          ## Automated editorial publication

          This pull request was created by the date-gated editorial workflow. It contains
          only the catalogue and sitemap updates for articles due on its execution date.

          ## Verification evidence

          - `node scripts/publish-due-blog-articles.mjs`
          - `node scripts/generate-sitemap.mjs`
          - The normal pull-request checks run before merge.

          ## Out of scope

          - Future-dated articles, application behaviour, production data and external
            publication outside the reviewed release workflow.
          EOF

          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$EDITORIAL_BRANCH" \
              --title 'chore(editorial): publish due blog articles' \
              --body-file "$pr_body" \
              --label documentation
          )"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "pull-request=$pr_url" >> "$GITHUB_OUTPUT"
