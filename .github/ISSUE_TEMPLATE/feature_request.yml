name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check the [roadmap tracking issue](https://github.com/albertogalvez-dev/Convive/issues/71)
        to see whether this is already planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the underlying need, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that demonstrate this request is complete.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
