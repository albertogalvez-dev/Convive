openapi: 3.1.0
info:
  title: 'Convive API'
  description: 'Public and professional HTTP API for the Convive school coexistence platform.'
  version: 0.1.0
paths:
  /api/v1/professional/cases/operational-overview/export:
    get:
      tags:
        - 'Professional cases'
      summary: 'Export non-identifying authorised operational counts as PDF'
      operationId: exportProfessionalOperationalOverview
      responses:
        '200':
          description: 'The non-identifying PDF overview.'
        '401':
          description: 'A professional session is required.'
      security:
        -
          professionalSession: []
  '/api/v1/public/organisations/{publicReportingIdentifier}':
    get:
      tags:
        - 'Public reporting'
      summary: 'Get the public reporting profile for an organisation'
      description: 'Returns the organisation name displayed before the anonymous reporting form.'
      operationId: getPublicReportingProfile
      parameters:
        -
          name: publicReportingIdentifier
          in: path
          description: 'Canonical public reporting identifier of the organisation.'
          required: true
          schema:
            type: string
            pattern: '^ORG_[0-9A-HJKMNP-TV-Z]{16}$'
            example: ORG_EZ8E3G9CR2F7VGDF
      responses:
        '200':
          description: 'The public reporting profile.'
          content:
            application/json:
              schema:
                required:
                  - name
                  - reportingMode
                properties:
                  name: { type: string, example: 'IES Valle Sereno' }
                  reportingMode: { type: string, example: operational, enum: [operational, fictional_demo, disabled] }
                type: object
                additionalProperties: false
        '404':
          description: 'The public reporting identifier is invalid or the organisation was not found.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
  '/api/v1/professional/organisations/{id}/memberships':
    get:
      tags:
        - 'Professional access'
      summary: 'List organisation memberships without case content'
      operationId: listOrganisationMemberships
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
  '/api/v1/professional/organisations/{id}/memberships/{professionalId}':
    post:
      tags:
        - 'Professional access'
      summary: 'Grant a role without assigning any case'
      operationId: grantOrganisationMembership
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: professionalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageOrganisationMembershipRequest'
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
  '/api/v1/professional/organisations/{id}/memberships/{membershipId}':
    patch:
      tags:
        - 'Professional access'
      summary: 'Change, suspend, resume or remove an organisation membership without changing case assignments'
      operationId: changeOrganisationMembership
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrganisationMembershipRequest'
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
  /api/v1/professional/account-credentials/accept:
    post:
      tags:
        - 'Professional access'
      summary: 'Activate a professional account or set a replacement password'
      operationId: acceptProfessionalCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptProfessionalCredentialRequest'
      responses:
        '204':
          description: 'The one-time credential was accepted.'
        '404':
          description: 'The credential is unavailable.'
        '429':
          description: 'Too many credential attempts were made.'
        '422':
          description: 'The credential request is invalid.'
  /api/v1/professional/account-administration:
    get:
      tags:
        - 'Professional access'
      summary: 'List organisations whose professional accounts the current user administers'
      operationId: listProfessionalAccountAdministrations
      responses:
        '200':
          description: 'The administered organisation list.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/organisations/{id}/accounts':
    get:
      tags:
        - 'Professional access'
      summary: 'List professional accounts in an administered organisation'
      operationId: listOrganisationProfessionalAccounts
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The account lifecycle list.'
      security:
        -
          professionalSession: []
    post:
      tags:
        - 'Professional access'
      summary: 'Create a fictional professional account and one-time activation credential'
      operationId: inviteOrganisationProfessional
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteProfessionalRequest'
      responses:
        '201':
          description: 'The account and activation credential were created.'
        '404':
          description: 'The organisation is unavailable in this scope.'
        '409':
          description: 'The account request conflicts with existing lifecycle state.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/organisations/{id}/accounts/{professionalId}/password-reset':
    post:
      tags:
        - 'Professional access'
      summary: 'Issue a one-time local password-reset credential'
      operationId: issueProfessionalPasswordReset
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: professionalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'The reset credential was created.'
        '429':
          description: 'Too many reset credentials were issued.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/organisations/{id}/accounts/{professionalId}/status':
    patch:
      tags:
        - 'Professional access'
      summary: 'Suspend, reactivate or deactivate a professional account'
      operationId: changeProfessionalAccountStatus
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: professionalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProfessionalAccountStatusRequest'
      responses:
        '200':
          description: 'The lifecycle state was changed.'
      security:
        -
          professionalSession: []
  /api/v1/professional/cases:
    get:
      tags:
        - 'Professional cases'
      summary: 'List operational views of cases assigned to the current professional'
      operationId: listProfessionalCases
      parameters:
        -
          name: view
          in: query
          schema:
            type: string
            enum:
              - assigned
              - overdue
              - upcoming
              - recent
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - assessment
              - active
              - closed
        -
          name: modality
          in: query
          schema:
            type: string
            enum:
              - in_person
              - digital
              - mixed
              - unknown
        -
          name: reference
          in: query
          schema:
            type: string
            maxLength: 64
        -
          name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            minimum: 1
        -
          name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: 'The bounded case workspace overview.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCasePage'
        '400':
          description: 'A filter or cursor is invalid.'
        '401':
          description: 'A professional session is required.'
      security:
        -
          professionalSession: []
  /api/v1/professional/cases/operational-summary:
    get:
      tags:
        - 'Professional cases'
      summary: 'Read permission-preserving case operational counts'
      operationId: getProfessionalCaseOperationalSummary
      responses:
        '200':
          description: 'Counts derived only from exact active case assignments.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseOperationalSummary'
        '401':
          description: 'A professional session is required.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}':
    get:
      tags:
        - 'Professional cases'
      summary: 'Read an assigned professional case workspace'
      operationId: getProfessionalCase
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The permission-scoped case workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseDetail'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/assignments':
    post:
      tags:
        - 'Professional cases'
      summary: 'Explicitly assign a contributor or observer to an exact case'
      description: 'Requires exact-case assignment management. Lead responsibility changes require the explicit handover endpoint.'
      operationId: assignProfessionalCaseCollaborator
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageProfessionalCaseAssignmentRequest'
      responses:
        '201':
          description: 'The explicit assignment was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseAssignment'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or target professional is unavailable in this scope.'
        '409':
          description: 'The assignment conflicts with the current case access.'
        '422':
          description: 'The assignment request is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/assignments/{assignmentId}/handover':
    post:
      tags:
        - 'Professional cases'
      summary: 'Atomically hand over exact-case lead responsibility'
      description: 'Requires exact-case assignment management and a recorded reason. The former lead is revoked as the new lead is created.'
      operationId: handoverProfessionalCaseLead
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverProfessionalCaseAssignmentRequest'
      responses:
        '201':
          description: 'The lead handover was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseAssignment'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case, assignment or target professional is unavailable in this scope.'
        '409':
          description: 'The handover conflicts with the current case access.'
        '422':
          description: 'The handover request is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/assignments/{assignmentId}/role':
    post:
      tags:
        - 'Professional cases'
      summary: 'Change a contributor or observer exact-case assignment'
      description: 'Requires exact-case assignment management and a recorded reason. Lead responsibility can only change through the explicit handover endpoint.'
      operationId: changeProfessionalCaseAssignmentRole
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProfessionalCaseAssignmentRoleRequest'
      responses:
        '200':
          description: 'The assignment role was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseAssignment'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or assignment is unavailable in this scope.'
        '409':
          description: 'The requested role change conflicts with the current case access.'
        '422':
          description: 'The assignment role request is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/assignments/{assignmentId}/revoke':
    post:
      tags:
        - 'Professional cases'
      summary: 'Explicitly revoke a non-lead exact-case assignment'
      description: 'Requires exact-case assignment management and a recorded reason. The final lead must use the explicit handover endpoint.'
      operationId: revokeProfessionalCaseAssignment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeProfessionalCaseAssignmentRequest'
      responses:
        '200':
          description: 'The assignment was revoked.'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or assignment is unavailable in this scope.'
        '409':
          description: 'The final lead requires an explicit handover.'
        '422':
          description: 'The revocation request is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/tasks':
    post:
      tags:
        - 'Professional cases'
      summary: 'Create an explicit source-aware task in an assigned case'
      description: 'Requires exact-case manage permission. This does not apply a protocol or confirm an external communication.'
      operationId: createProfessionalCaseTask
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessionalCaseTaskRequest'
      responses:
        '201':
          description: 'The explicit task was created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseTask'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case is unavailable in this scope.'
        '422':
          description: 'The task request is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/tasks/{taskId}/complete':
    post:
      tags:
        - 'Professional cases'
      summary: 'Explicitly complete a pending case task'
      operationId: completeProfessionalCaseTask
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The task was completed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseTask'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or task is unavailable in this scope.'
        '409':
          description: 'The task has already reached a terminal state.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/tasks/{taskId}/not-applicable':
    post:
      tags:
        - 'Professional cases'
      summary: 'Explicitly mark a pending case task not applicable with a reason'
      operationId: markProfessionalCaseTaskNotApplicable
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkProfessionalCaseTaskNotApplicableRequest'
      responses:
        '200':
          description: 'The task was marked not applicable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseTask'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or task is unavailable in this scope.'
        '409':
          description: 'The task has already reached a terminal state.'
        '422':
          description: 'The resolution reason is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/evidence/{attachmentId}/download':
    get:
      tags:
        - 'Professional cases'
      summary: 'Download available evidence from an assigned case'
      description: 'Streams one available private attachment through the exact case-assignment boundary.'
      operationId: downloadProfessionalCaseEvidence
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The authorised evidence stream.'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case or evidence is unavailable in this scope.'
        '429':
          description: 'The download rate or concurrency limit was exceeded.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/audit-events':
    get:
      tags:
        - 'Professional cases'
      summary: 'Read the explicit audit trail for an assigned case'
      description: 'Requires the separate case audit permission and returns no case content or target identifiers.'
      operationId: listProfessionalCaseAuditEvents
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The minimised ordered audit events.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalCaseAuditEventPage'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/audit-events/export':
    get:
      tags:
        - 'Professional cases'
      summary: 'Export the minimal audit trail for an assigned case'
      description: 'Requires the separate case audit permission. The CSV excludes case content, people, evidence, reasons and target identifiers.'
      operationId: exportProfessionalCaseAuditEvents
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The minimised audit CSV.'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/export':
    get:
      tags:
        - 'Professional cases'
      summary: 'Export a minimised lead-authorised case record as PDF'
      operationId: exportProfessionalCaseRecord
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The controlled PDF record.'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The case is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/people':
    post:
      tags:
        - 'Professional cases'
      summary: 'Add a minimised case-local person'
      operationId: addCaseInvolvedPerson
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageCaseInvolvedPersonRequest'
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
  '/api/v1/professional/cases/{id}/people/{personId}':
    delete:
      tags:
        - 'Professional cases'
      summary: 'Logically remove a case-local person without deleting history'
      operationId: removeCaseInvolvedPerson
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
    patch:
      tags:
        - 'Professional cases'
      summary: 'Correct a minimised case-local person'
      operationId: correctCaseInvolvedPerson
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: personId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageCaseInvolvedPersonRequest'
      responses:
        default:
          description: ''
      security:
        -
          professionalSession: []
  /api/v1/professional/reports:
    get:
      tags:
        - 'Professional reports'
      summary: 'List reports in the professional inbox'
      operationId: listProfessionalReports
      parameters:
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - new
              - reviewed
        -
          name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            minimum: 1
        -
          name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: 'An organisation-scoped report page.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalReportPage'
        '400':
          description: 'A filter or cursor is invalid.'
        '401':
          description: 'A professional session is required.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}':
    get:
      tags:
        - 'Professional reports'
      summary: 'Read an authorised professional report'
      operationId: getProfessionalReport
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The authorised report detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalReportDetail'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}/attachments':
    get:
      tags:
        - 'Professional reports'
      summary: 'List available evidence for an authorised professional report'
      description: "Returns only available attachments in the professional's active triage scope. Processing, rejected and deleted evidence is omitted."
      operationId: listProfessionalReportAttachments
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Available attachments in the authorised report scope.'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProfessionalReportAttachment' } }
                type: object
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report is unavailable in this scope.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}/attachments/{attachmentId}/download':
    get:
      tags:
        - 'Professional reports'
      summary: 'Download available evidence in an authorised professional report'
      description: 'Streams one available private attachment with a generated filename. It never returns a direct object URL or an inline preview.'
      operationId: downloadProfessionalReportAttachment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The authorised attachment stream.'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report or attachment is unavailable in this scope.'
        '429':
          description: 'The download rate or concurrent stream limit was exceeded.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}/reviews':
    post:
      tags:
        - 'Professional reports'
      summary: 'Record the initial professional review of a report'
      operationId: reviewProfessionalReport
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  minLength: 10
                professionalConcernCategory:
                  type: string
                  enum: [peer_interaction, digital_interaction, exclusion_or_isolation, harmful_language_or_conduct, safety_or_wellbeing_concern, other, unknown]
                professionalRecurrence:
                  type: string
                  enum: [single, repeated, ongoing, unknown]
                professionalAttentionCue:
                  type: string
                  enum: [needs_prompt_attention, no_prompt_attention_indicated, unknown]
              type: object
      responses:
        '201':
          description: 'The initial review was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalReportReviewResponse'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report is unavailable in this scope.'
        '409':
          description: 'The report was already reviewed.'
        '422':
          description: 'The review reason is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}/triage-decisions':
    post:
      tags:
        - 'Professional reports'
      summary: 'Record an authorised report triage decision'
      description: 'Appends a keep decision or records one terminal redirect, dismissal or idempotent report-to-case link. The original report is never rewritten or deleted.'
      operationId: triageProfessionalReport
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - outcome
                - reason
              properties:
                outcome:
                  type: string
                  enum: [keep, redirect, dismiss, link_to_case]
                reason:
                  type: string
                  maxLength: 1000
                  minLength: 10
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 'The decision was recorded, or the existing case link was returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalReportTriageResponse'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report is unavailable in this scope.'
        '409':
          description: 'The report is not reviewed or triage is already final.'
        '422':
          description: 'The triage decision is invalid.'
      security:
        -
          professionalSession: []
  '/api/v1/professional/reports/{id}/responses':
    post:
      tags:
        - 'Professional reports'
      summary: 'Publish a reporter-visible professional response'
      description: 'Appends an immutable professional-authored entry to the reporter-visible conversation. Internal notes are not accepted by this resource.'
      operationId: respondToProfessionalReport
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 2000
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 'The reporter-visible response was published.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpEntry'
        '401':
          description: 'A professional session is required.'
        '404':
          description: 'The report is unavailable in this scope.'
        '409':
          description: 'The conversation has reached its entry limit.'
        '422':
          description: 'The response content is invalid.'
      security:
        -
          professionalSession: []
  /api/v1/professional/session:
    get:
      tags:
        - 'Professional access'
      summary: 'Get the current professional session'
      operationId: getProfessionalSession
      responses:
        '200':
          description: 'The current professional identity.'
        '401':
          description: 'No active professional session.'
      security:
        -
          professionalSession: []
    post:
      tags:
        - 'Professional access'
      summary: 'Create a professional session'
      operationId: createProfessionalSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              type: object
      responses:
        '200':
          description: 'The professional session was created.'
        '401':
          description: 'Authentication failed.'
        '429':
          description: 'Too many authentication attempts.'
    delete:
      tags:
        - 'Professional access'
      summary: 'End the current professional session'
      operationId: deleteProfessionalSession
      responses:
        '204':
          description: 'The session was invalidated.'
      security:
        -
          professionalSession: []
  /api/v1/reporter/report/follow-up-entries:
    post:
      tags:
        - 'Public reporting'
      summary: "Append a follow-up entry to the reporter's own report"
      description: 'Adds reporter-authored text to the report resolved by the presented capability cookie. The original submission remains unchanged; entries are ordered and cannot be edited or removed.'
      operationId: addReportFollowUpEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 2000
              type: object
      responses:
        '201':
          description: 'The follow-up entry was added.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpEntry'
        '401':
          description: 'The report access capability was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'The submitted follow-up entry is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'The report cannot accept more follow-up entries.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'The follow-up append limit was exceeded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
  /api/v1/reporter/report:
    get:
      tags:
        - 'Public reporting'
      summary: "Read the current reporter's report and follow-up state"
      description: 'Returns the report resolved by the presented capability cookie: the original submission and any authorised follow-up entries. Excludes internal professional and case-management data by construction.'
      operationId: getReportFollowUpState
      responses:
        '200':
          description: 'The report follow-up state.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFollowUpStateResponse'
        '401':
          description: 'The report access capability was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'The follow-up read limit was exceeded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
  /api/v1/reporter/report/email-notifications:
    get:
      tags:
        - 'Public reporting'
      summary: 'Read the optional reporter-email notification state'
      description: 'Returns only whether the feature is available and whether the contact is absent, pending or verified. It never returns the address.'
      operationId: getReporterEmailNotificationStatus
      responses:
        '200':
          description: 'The privacy-minimised notification state.'
          content:
            application/json:
              schema:
                required:
                  - enabled
                  - status
                properties:
                  enabled: { type: boolean }
                  status: { type: string, enum: [none, pending, verified] }
                type: object
        '401':
          description: 'The report access capability was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
    put:
      tags:
        - 'Public reporting'
      summary: 'Request optional generic reporter-email notifications'
      description: 'Stores a separate pending contact and queues a generic mailbox-verification message. The address grants no report access.'
      operationId: configureReporterEmailNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - consentAccepted
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                consentAccepted:
                  type: boolean
                  enum: [true]
              type: object
      responses:
        '202':
          description: 'Verification was queued or the existing verified contact was retained.'
          content:
            application/json:
              schema:
                required:
                  - enabled
                  - status
                properties:
                  enabled: { type: boolean }
                  status: { type: string, enum: [pending, verified] }
                type: object
        '401':
          description: 'The report access capability was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The request failed same-origin validation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'The address or consent evidence is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'The configuration limit was exceeded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
    delete:
      tags:
        - 'Public reporting'
      summary: 'Remove the optional reporter-email contact'
      description: 'Immediately deletes the separated contact and cascades all queued or retrying delivery work.'
      operationId: removeReporterEmailNotifications
      responses:
        '204':
          description: 'The contact and notification work were removed.'
        '401':
          description: 'The report access capability was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The request failed same-origin validation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
  /api/v1/public/reporter-email-verifications:
    post:
      tags:
        - 'Public reporting'
      summary: 'Verify an optional reporter-email contact'
      description: 'Consumes a single-use mailbox token. It grants no report capability and returns no report information.'
      operationId: verifyReporterEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
              properties:
                token:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
              type: object
      responses:
        '200':
          description: 'The mailbox was verified.'
          content:
            application/json:
              schema:
                required:
                  - verified
                properties:
                  verified: { type: boolean, enum: [true] }
                type: object
        '422':
          description: 'The token is invalid, expired or already used.'
          content:
            application/json:
              schema:
                required:
                  - verified
                properties:
                  verified: { type: boolean, enum: [false] }
                type: object
        '429':
          description: 'The verification limit was exceeded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/reporter/report/attachments:
    get:
      tags:
        - 'Public reporting'
      summary: "List the reporter's attachment states"
      description: 'Returns only a minimal processing or unavailable state until an attachment is scanned and available. It never exposes a scanner verdict or storage metadata.'
      operationId: listReporterReportAttachments
      responses:
        '200':
          description: 'The reporter attachment states.'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReporterAttachment' } }
                type: object
        '401':
          description: 'The report access capability was not accepted.'
        '429':
          description: 'The read rate limit was exceeded.'
      security:
        -
          reportAccessCookie: []
    post:
      tags:
        - 'Public reporting'
      summary: "Upload evidence for the reporter's own report"
      description: 'Accepts up to three PDF, JPEG or PNG multipart files only after capability and same-origin checks. Files remain unavailable until private scanning completes.'
      operationId: uploadReporterReportAttachments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - attachments
              properties:
                attachments:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 3
                descriptions:
                  type: array
                  items: { type: string, maxLength: 500 }
                  maxItems: 3
              type: object
      responses:
        '201':
          description: 'Private attachment records were quarantined for scanning.'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReporterAttachment' } }
                type: object
        '401':
          description: 'The report access capability was not accepted.'
        '403':
          description: 'The upload failed CSRF validation.'
        '409':
          description: 'The report attachment capacity was reached.'
        '413':
          description: 'An attachment exceeds the accepted size.'
        '415':
          description: 'A submitted attachment type is not accepted.'
        '422':
          description: 'The multipart upload is invalid.'
        '429':
          description: 'The upload rate limit was exceeded.'
      security:
        -
          reportAccessCookie: []
  '/api/v1/reporter/report/attachments/{id}/download':
    get:
      tags:
        - 'Public reporting'
      summary: "Download an available attachment from the reporter's own report"
      description: 'Streams an available private object with a generated filename. Files that are processing, rejected or deleted are indistinguishable from unknown attachments.'
      operationId: downloadReporterReportAttachment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The authorised attachment stream.'
        '401':
          description: 'The report access capability was not accepted.'
        '404':
          description: 'The attachment is unavailable.'
        '429':
          description: 'The download rate or concurrent stream limit was exceeded.'
      security:
        -
          reportAccessCookie: []
  /api/v1/reporter/access-grant:
    delete:
      tags:
        - 'Public reporting'
      summary: 'Revoke the current report-access capability'
      description: 'Revokes the capability presented through the protected cookie, if any, and clears the cookie. Idempotent: it succeeds even when no active grant is presented.'
      operationId: revokeReportAccessGrant
      responses:
        '204':
          description: 'The capability was revoked and the cookie cleared.'
        '403':
          description: 'The request failed CSRF validation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        -
          reportAccessCookie: []
  '/api/v1/public/organisations/{publicReportingIdentifier}/reports':
    post:
      tags:
        - 'Public reporting'
      summary: 'Submit an anonymous report'
      description: 'Creates an anonymous report for the selected organisation. The access secret is returned only once and must be stored securely by the reporter.'
      operationId: submitAnonymousReport
      parameters:
        -
          name: publicReportingIdentifier
          in: path
          description: 'Public identifier of the organisation receiving the report.'
          required: true
          schema:
            type: string
            pattern: '^ORG_[0-9A-HJKMNP-TV-Z]{16}$'
            example: ORG_EZ8E3G9CR2F7VGDF
        -
          name: Idempotency-Key
          in: header
          description: 'Optional client-generated key. A repeated request with the same key and identifier returns the original report reference instead of creating a duplicate. The access secret is only ever returned on the first, original response — it is never replayed.'
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        description: 'Anonymous report information.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnonymousReportRequest'
      responses:
        '201':
          description: 'The anonymous report was created successfully.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousReportSubmissionResponse'
        '200':
          description: 'A request with this Idempotency-Key and identifier was already processed. The report already exists; its access secret is not included, since it was only ever returned on the original response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentReportSubmissionResponse'
        '400':
          description: 'The request body contains malformed JSON.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The public fictional demonstration does not accept report content.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'The reporting organisation does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'The request content type is not application/json.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'The submitted report information is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'Too many submissions were made.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
  /api/v1/public/report-access-grants:
    post:
      tags:
        - 'Public reporting'
      summary: 'Exchange an access secret for a report-scoped capability'
      description: 'Verifies a single-use anonymous access secret and, if accepted, issues a short-lived capability bound to exactly one report through a protected cookie. Malformed, unknown and revoked secrets return the same safe failure.'
      operationId: verifyReportAccess
      requestBody:
        description: 'The plain access secret shown once at submission time.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyReportAccessRequest'
      responses:
        '204':
          description: 'A capability was issued and returned through a protected cookie.'
        '401':
          description: 'The access secret was not accepted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The public fictional demonstration does not issue reporter capabilities.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: 'Too many verification attempts were made.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
  /api/v1/health:
    get:
      operationId: get_api_v1_health
      responses:
        default:
          description: ''
components:
  schemas:
    AnonymousReportSubmissionResponse:
      required:
        - publicReference
        - accessSecret
        - status
        - createdAt
      properties:
        publicReference:
          description: 'Public reference used to identify the submitted report.'
          type: string
          example: 0123456789ABCDEF0123
        accessSecret:
          description: 'Secret shown once and required for future private access to the report.'
          type: string
        status:
          type: string
          example: received
          enum:
            - received
        createdAt:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    IdempotentReportSubmissionResponse:
      required:
        - publicReference
        - status
        - createdAt
      properties:
        publicReference:
          description: 'Public reference of the report already created by the original request.'
          type: string
          example: 0123456789ABCDEF0123
        status:
          type: string
          example: received
          enum:
            - received
        createdAt:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    FollowUpEntry:
      required:
        - authorType
        - content
        - createdAt
      properties:
        authorType:
          description: 'Who authored the entry, without identifying them.'
          type: string
          enum:
            - reporter
            - professional
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    ReportFollowUpStateResponse:
      required:
        - publicReference
        - situationDescription
        - situationContext
        - status
        - createdAt
        - followUpEntries
      properties:
        publicReference:
          description: 'Public reference of the report.'
          type: string
          example: 0123456789ABCDEF0123
        situationDescription:
          description: 'The situation description originally submitted by the reporter.'
          type: string
        situationContext:
          type: string
          enum:
            - in_person
            - digital
            - mixed
            - unknown
        reporterTaxonomy:
          $ref: '#/components/schemas/ReporterTriageTaxonomy'
        status:
          type: string
          example: received
          enum:
            - received
            - reviewed
        createdAt:
          type: string
          format: date-time
        followUpEntries:
          description: 'Authorised follow-up entries ordered by creation time and UUID, oldest first.'
          type: array
          items:
            $ref: '#/components/schemas/FollowUpEntry'
          maxItems: 100
      type: object
      additionalProperties: false
    ReporterAttachment:
      required:
        - id
        - status
        - createdAt
        - description
      properties:
        id:
          type: string
          format: uuid
        status:
          description: 'A minimal lifecycle state that never exposes a scanner verdict.'
          type: string
          enum:
            - processing
            - available
            - unavailable
        createdAt:
          type: string
          format: date-time
        description:
          description: 'Optional reporter-supplied context. The original client filename is never stored or returned.'
          type:
            - string
            - 'null'
          maxLength: 500
        mediaType:
          description: 'Present only when the attachment is available.'
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        byteSize:
          description: 'Present only when the attachment is available.'
          type: integer
          maximum: 5242880
          minimum: 1
      type: object
      additionalProperties: false
    ProfessionalReportAttachment:
      required:
        - id
        - mediaType
        - byteSize
        - createdAt
        - description
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        byteSize:
          type: integer
          maximum: 5242880
          minimum: 1
        createdAt:
          type: string
          format: date-time
        description:
          description: 'Optional reporter-supplied context. The original client filename is never stored or returned.'
          type:
            - string
            - 'null'
          maxLength: 500
      type: object
      additionalProperties: false
    ReporterTriageTaxonomy:
      required:
        - version
        - recurrence
        - attentionCue
      properties:
        version:
          type: string
          example: andalucia-v1
        recurrence:
          type: string
          enum:
            - single
            - repeated
            - ongoing
            - unknown
        attentionCue:
          type: string
          enum:
            - needs_prompt_attention
            - no_prompt_attention_indicated
            - unknown
      type: object
      additionalProperties: false
    ProfessionalTriageTaxonomy:
      required:
        - version
        - concernCategory
        - recurrence
        - attentionCue
      properties:
        version:
          type: string
          example: andalucia-v1
        concernCategory:
          type:
            - string
            - 'null'
          enum:
            - peer_interaction
            - digital_interaction
            - exclusion_or_isolation
            - harmful_language_or_conduct
            - safety_or_wellbeing_concern
            - other
            - unknown
        recurrence:
          type:
            - string
            - 'null'
          enum:
            - single
            - repeated
            - ongoing
            - unknown
        attentionCue:
          type:
            - string
            - 'null'
          enum:
            - needs_prompt_attention
            - no_prompt_attention_indicated
            - unknown
      type: object
      additionalProperties: false
    ProfessionalReportSummary:
      required:
        - id
        - publicReference
        - situationPreview
        - situationContext
        - reporterTaxonomy
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        publicReference:
          type: string
          example: 0123456789ABCDEF0123
        situationPreview:
          type: string
          maxLength: 111
        situationContext:
          type: string
          enum:
            - in_person
            - digital
            - mixed
            - unknown
        reporterTaxonomy:
          $ref: '#/components/schemas/ReporterTriageTaxonomy'
        status:
          type: string
          enum:
            - new
            - reviewed
        createdAt:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    ProfessionalReportReview:
      required:
        - reason
        - reviewedAt
        - professionalTaxonomy
      properties:
        reason:
          type: string
          maxLength: 1000
          minLength: 10
        reviewedAt:
          type: string
          format: date-time
        professionalTaxonomy:
          $ref: '#/components/schemas/ProfessionalTriageTaxonomy'
      type: object
      additionalProperties: false
    ProfessionalReportDetail:
      required:
        - id
        - publicReference
        - situationPreview
        - situationContext
        - reporterTaxonomy
        - status
        - createdAt
        - situationDescription
        - review
        - followUpEntries
        - triageDecisions
      properties:
        id:
          type: string
          format: uuid
        publicReference:
          type: string
          example: 0123456789ABCDEF0123
        situationPreview:
          type: string
          maxLength: 111
        situationContext:
          type: string
          enum:
            - in_person
            - digital
            - mixed
            - unknown
        reporterTaxonomy:
          $ref: '#/components/schemas/ReporterTriageTaxonomy'
        status:
          type: string
          enum:
            - new
            - reviewed
        createdAt:
          type: string
          format: date-time
        situationDescription:
          type: string
        review:
          oneOf:
            -
              $ref: '#/components/schemas/ProfessionalReportReview'
            -
              type: 'null'
        followUpEntries:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpEntry'
