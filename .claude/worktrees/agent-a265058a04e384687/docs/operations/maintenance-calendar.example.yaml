# Copy this template to the private operator register. Do not populate it with
# credentials, payment details, personal contact data or real report data.
support_end: 2027-08-31
public_deployment_deadline: 2026-08-31
reminder_offsets_days: [30, 7]

services:
  - id: vps
    owner: repository-maintainer
    status: needs_operator_confirmation
    renewal_date: null
    checks: [billing, capacity, ssh-access, convive-only-cleanup]

  - id: public-hostname
    owner: repository-maintainer
    status: not_provisioned
    renewal_date: null
    checks: [dns, tunnel, edge-tls]

  - id: cloudflare-r2
    owner: repository-maintainer
    status: provisioned_restore_exercise_required
    renewal_date: null
    checks: [private-bucket, eu-jurisdiction, usage, billing-alert, restore]

  - id: github
    owner: repository-maintainer
    status: active
    renewal_date: null
    checks: [repository-access, actions-ci, dependabot]

cadence:
  release: every-release
  automated-health: every-minute
  backup: daily-0230-europe-madrid
  operator-alert-review: weekly-monday
  dependency-security-review: weekly-monday
  restore-exercise: monthly
  ownership-and-provider-review: quarterly
