<div
  class="backdrop"
  role="button"
  tabindex="0"
  [attr.aria-label]="'report-help.close' | transloco"
  (click)="closed.emit()"
  (keydown.enter)="closed.emit()"
  (keydown.space)="onSpace($event)"
>
  <section
    #dialog
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="help-title"
    tabindex="-1"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="close"
      [attr.aria-label]="'report-help.close' | transloco"
      (click)="closed.emit()"
    >
      ×
    </button>
    <h2 id="help-title">{{ 'report-help.title' | transloco }}</h2>
    <ol>
      @for (step of 'report-help.steps' | transloco; track step) {
        <li>{{ step }}</li>
      }
    </ol>
    <p>
      {{ 'report-help.footer' | transloco }}
    </p>
  </section>
</div>
