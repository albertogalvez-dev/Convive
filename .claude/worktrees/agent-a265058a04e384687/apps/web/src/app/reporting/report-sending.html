<div class="sending" role="status">
  <div class="orbit" aria-hidden="true">
    <div class="shield">✓</div>
  </div>
  <p class="eyebrow">{{ 'report-sending.eyebrow' | transloco }}</p>
  <h1 id="step-title">{{ 'report-sending.title' | transloco }}</h1>
  <p>{{ 'report-sending.body' | transloco }}</p>
  <div class="activity" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="live">{{ 'report-sending.live' | transloco }}</p>
</div>
