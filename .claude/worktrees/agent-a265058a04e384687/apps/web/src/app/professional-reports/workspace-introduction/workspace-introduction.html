@if (open()) {
  <div class="introduction-backdrop" (keydown)="onKeydown($event)">
    <div
      #dialog
      class="introduction-dialog"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      aria-labelledby="introduction-title"
      aria-describedby="introduction-body"
    >
      <p class="position" role="status">
        Paso {{ stepIndex() + 1 }} de {{ steps.length }}: {{ steps[stepIndex()].title }}
      </p>

      <h2 id="introduction-title">{{ steps[stepIndex()].title }}</h2>

      <div id="introduction-body">
        @for (paragraph of steps[stepIndex()].body; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>

      <div class="controls">
        <button type="button" class="skip" (click)="dismiss()">
          {{ isLastStep ? 'Cerrar' : 'Saltar la introducción' }}
        </button>
        <div class="advance">
          @if (stepIndex() > 0) {
            <button type="button" (click)="previous()">Anterior</button>
          }
          <button type="button" class="primary" (click)="next()">
            {{ isLastStep ? 'Empezar' : 'Siguiente' }}
          </button>
        </div>
      </div>

      <p class="escape-hint">Puedes salir en cualquier momento con la tecla Escape.</p>
    </div>
  </div>
}
